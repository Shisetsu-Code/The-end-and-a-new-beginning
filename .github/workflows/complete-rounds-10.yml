name: Complete rounds in 10 games per working provider

on:
  push:
    branches: [main]
    paths: ['capture-runner/operations/complete-rounds-10-request.json']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: complete-rounds-10
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      BINARY_SOURCE_SHA: af8f957cce4cd57fe633da50b4620116ed19c6e3
      BINARY_SOURCE_RUN_ID: '43699080917'
      EXPECTED_BINARY_SHA256: faceddbd1e234c09eb2147affcd553b2e8dce00c9423de6d2e2de4010af179a6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare private evidence
        run: |
          set -euo pipefail
          umask 077
          output="$GITHUB_WORKSPACE/complete-rounds-10-output"
          config="$GITHUB_WORKSPACE/capture-runner/operations/complete-rounds-10-request.json"
          mkdir -p "$output"
          printf '1\n' > "$output/exit-code.txt"
          printf '{"status":"not_started","exit_code":1}\n' > "$output/execution.json"
          cp "$config" "$output/config.json"
          cp capture-runner/operations/complete-rounds-10-selection.json "$output/selection.json"
          jq -e '.data_root == "../../complete-rounds-10-output/captures"
            and .samples_per_mode == 1 and .default_parallel_games == 2
            and .max_steps == 512 and .timeout_seconds == 20
            and (.providers | length) == 21 and (.games | length) == 210
            and (.games | unique | length) == 210 and .modes == []
            and .exits == [{"id":"direct"}]' "$config" > /dev/null

      - name: Verify the successful source CI and unchanged runtime inputs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          output="$GITHUB_WORKSPACE/complete-rounds-10-output"
          curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$BINARY_SOURCE_RUN_ID" \
            > "$output/source-ci.json"
          jq -e --arg sha "$BINARY_SOURCE_SHA" --arg repo "$GITHUB_REPOSITORY" \
            --argjson run "$BINARY_SOURCE_RUN_ID" '
              .id == $run and .status == "completed" and .conclusion == "success"
              and .head_sha == $sha and .head_branch == "main"
              and .repository.full_name == $repo and .head_repository.full_name == $repo
            ' "$output/source-ci.json" > /dev/null
          git diff --exit-code "$BINARY_SOURCE_SHA" HEAD -- \
            capture-runner ':(exclude)capture-runner/operations' \
            ':(exclude)capture-runner/docs' ':(exclude)capture-runner/README.md' \
            ':(exclude)capture-runner/AGENTS.md' 'standalone info' \
            .cargo rust-toolchain rust-toolchain.toml \
            > "$output/runtime-inputs.diff"
          printf 'verified\n' > "$output/runtime-inputs-check.txt"

      - name: Download the pinned executable from that CI
        uses: actions/download-artifact@v4
        with:
          name: capture-runner-linux-x86_64
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ env.BINARY_SOURCE_RUN_ID }}
          path: ${{ runner.temp }}/complete-rounds-10-bin

      - name: Plan and capture complete native rounds
        id: capture
        run: |
          set -euo pipefail
          umask 077
          output="$GITHUB_WORKSPACE/complete-rounds-10-output"
          config="$GITHUB_WORKSPACE/capture-runner/operations/complete-rounds-10-request.json"
          runner="$RUNNER_TEMP/complete-rounds-10-bin/capture-runner"
          chmod 700 "$runner"
          sha256sum "$runner" > "$output/binary.sha256"
          printf '%s  %s\n' "$EXPECTED_BINARY_SHA256" "$runner" |
            sha256sum -c - > "$output/binary-check.stdout.log" 2> "$output/binary-check.stderr.log"
          started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          run_campaign() {
            set -euo pipefail
            local runner="$1" config="$2" output="$3" plan_code validation_code run_code
            set +e
            "$runner" plan --config "$config" --details > "$output/plan.json" 2> "$output/plan.stderr.log"
            plan_code=$?
            set -e
            printf '%s\n' "$plan_code" > "$output/plan-exit-code.txt"
            if (( plan_code != 0 )); then return "$plan_code"; fi
            set +e
            jq -e '
              (.providers | length) == 21 and
              all(.providers[]; .games == 10 and .games_with_executable_modes == 10) and
              ([.providers[].executable_modes] | add) == 582 and
              ([.providers[].unsupported_modes] | add) == 11 and
              .samples_per_mode == 1 and .configured_game_slots == 42 and
              .maximum_active_games_for_selection == 42 and
              .catalog_sha256 == "62313f02295d368df06d344816564bdc335b8e39c914f092e59e3e6e8bfe35ac"
            ' "$output/plan.json" > "$output/plan-validation.stdout.log" 2> "$output/plan-validation.stderr.log"
            validation_code=$?
            set -e
            printf '%s\n' "$validation_code" > "$output/plan-validation-exit-code.txt"
            if (( validation_code != 0 )); then return "$validation_code"; fi
            set +e
            "$runner" run --config "$config" > "$output/runner.stdout.log" 2> "$output/runner.stderr.log"
            run_code=$?
            set -e
            printf '%s\n' "$run_code" > "$output/runner-exit-code.txt"
            return "$run_code"
          }
          export -f run_campaign
          set +e
          timeout --signal=INT --kill-after=20s 1200s \
            bash --noprofile --norc -c 'run_campaign "$@"' -- "$runner" "$config" "$output" \
            > "$output/timeout.stdout.log" 2> "$output/timeout.stderr.log"
          exit_code=$?
          set -e
          printf '%s\n' "$exit_code" > "$output/exit-code.txt"
          plan_code=null
          run_code=null
          if [[ -f "$output/plan-exit-code.txt" ]]; then read -r plan_code < "$output/plan-exit-code.txt"; fi
          if [[ -f "$output/runner-exit-code.txt" ]]; then read -r run_code < "$output/runner-exit-code.txt"; fi
          jq -n --arg started_at "$started_at" --arg finished_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg workflow_commit "$GITHUB_SHA" --arg workflow_run_id "$GITHUB_RUN_ID" \
            --arg workflow_run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg binary_source_commit "$BINARY_SOURCE_SHA" --arg binary_source_run_id "$BINARY_SOURCE_RUN_ID" \
            --arg binary_sha256 "$EXPECTED_BINARY_SHA256" --argjson exit_code "$exit_code" \
            --argjson plan_exit_code "$plan_code" --argjson runner_exit_code "$run_code" \
            '{status:"finished",started_at:$started_at,finished_at:$finished_at,
              workflow_commit:$workflow_commit,workflow_run_id:$workflow_run_id,workflow_run_attempt:$workflow_run_attempt,
              binary_source_commit:$binary_source_commit,binary_source_run_id:$binary_source_run_id,
              binary_sha256:$binary_sha256,runtime_inputs_verified:true,timeout_seconds:1200,kill_grace_seconds:20,
              exit_code:$exit_code,plan_exit_code:$plan_exit_code,runner_exit_code:$runner_exit_code}' > "$output/execution.json"

      - name: Encrypt all available evidence
        id: encrypt
        if: always()
        run: |
          set -euo pipefail
          umask 077
          output="$GITHUB_WORKSPACE/complete-rounds-10-output"
          if [[ ! -d "$output" ]]; then exit 0; fi
          artifacts="$RUNNER_TEMP/complete-rounds-10-artifacts"
          mkdir -p "$artifacts"
          {
            tar -C "$GITHUB_WORKSPACE" -czf - complete-rounds-10-output |
              openssl cms -encrypt -binary -aes-256-cbc -outform DER \
                -out "$artifacts/complete-rounds-10.p7m.tmp" \
                "$GITHUB_WORKSPACE/capture-runner/operations/complete-rounds-10-recipient.pem"
          } 2> "$RUNNER_TEMP/complete-rounds-10-encryption.stderr.log"
          mv "$artifacts/complete-rounds-10.p7m.tmp" "$artifacts/complete-rounds-10.p7m"
          cd "$artifacts"
          sha256sum complete-rounds-10.p7m > complete-rounds-10.p7m.sha256
          printf 'encrypted=true\n' >> "$GITHUB_OUTPUT"

      - name: Upload encrypted captures
        id: upload
        if: always() && steps.encrypt.outputs.encrypted == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: complete-rounds-10-encrypted
          path: |
            ${{ runner.temp }}/complete-rounds-10-artifacts/complete-rounds-10.p7m
            ${{ runner.temp }}/complete-rounds-10-artifacts/complete-rounds-10.p7m.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Preserve the campaign result
        if: always()
        env:
          CAPTURE_OUTCOME: ${{ steps.capture.outcome }}
          ENCRYPT_OUTCOME: ${{ steps.encrypt.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
        run: |
          set -euo pipefail
          exit_code=1
          output="$GITHUB_WORKSPACE/complete-rounds-10-output"
          if [[ -f "$output/exit-code.txt" ]]; then
            read -r saved_code < "$output/exit-code.txt"
            if [[ "$saved_code" =~ ^[0-9]{1,3}$ ]] && (( 10#$saved_code <= 255 )); then exit_code=$((10#$saved_code)); fi
          fi
          campaign_code=$exit_code
          if [[ "$CAPTURE_OUTCOME" != success || "$ENCRYPT_OUTCOME" != success || "$UPLOAD_OUTCOME" != success ]]; then exit_code=1; fi
          {
            printf '## Complete native round sample\n\n'
            printf 'Planned selection: 21 providers, 210 games, 582 executable modes, 11 unsupported catalog modes.\n\n'
            printf 'Campaign exit: %s. Final exit: %s. Evidence upload: %s.\n' "$campaign_code" "$exit_code" "$UPLOAD_OUTCOME"
            printf 'The runner also returns 2 for unsupported modes; inspect native results before classifying failures.\n'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$exit_code"
