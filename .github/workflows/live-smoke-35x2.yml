name: Live smoke 35 providers x 2 games

on:
  push:
    branches: [main]
    paths: ['capture-runner/operations/live-smoke-35x2-request.json']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: live-smoke-35x2
  cancel-in-progress: false

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the campaign request
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Prepare private evidence directory
        run: |
          set -euo pipefail
          umask 077
          output="$GITHUB_WORKSPACE/live-smoke-output"
          config="$GITHUB_WORKSPACE/capture-runner/operations/live-smoke-35x2-request.json"
          mkdir -p "$output"
          printf '1\n' > "$output/exit-code.txt"
          printf '{"status":"not_started","exit_code":1}\n' > "$output/execution.json"
          cp "$config" "$output/config.json"
          jq -e '.data_root == "../../live-smoke-output/captures"' "$config" > /dev/null

      - name: Download the verified Linux executable
        uses: actions/download-artifact@v4
        with:
          name: capture-runner-linux-x86_64
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 43686603978
          path: ${{ runner.temp }}/live-smoke-bin

      - name: Plan and run all providers together
        id: capture
        run: |
          set -euo pipefail
          umask 077
          output="$GITHUB_WORKSPACE/live-smoke-output"
          config="$GITHUB_WORKSPACE/capture-runner/operations/live-smoke-35x2-request.json"
          runner="$RUNNER_TEMP/live-smoke-bin/capture-runner"
          chmod 700 "$runner"
          sha256sum "$runner" > "$output/binary.sha256"
          binary_sha256=$(cut -d ' ' -f 1 "$output/binary.sha256")
          printf '%s  %s\n' \
            c4c8a6e17e12581f558f862207c3b141fcd8feb3e215eb7aaad7e4bd21f54271 "$runner" |
            sha256sum -c - > "$output/binary-check.stdout.log" 2> "$output/binary-check.stderr.log"
          started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          run_campaign() {
            set -euo pipefail
            local runner="$1" config="$2" output="$3" plan_code validation_code run_code
            set +e
            "$runner" plan --config "$config" --details \
              > "$output/plan.json" 2> "$output/plan.stderr.log"
            plan_code=$?
            set -e
            printf '%s\n' "$plan_code" > "$output/plan-exit-code.txt"
            if (( plan_code != 0 )); then
              return "$plan_code"
            fi
            set +e
            jq -e '
              (.providers | length) == 35 and
              all(.providers[]; .games == 2) and
              ([.providers[].games_with_executable_modes] | add) == 69 and
              ([.providers[].executable_modes] | add) == 202 and
              .configured_game_slots == 70 and
              .maximum_active_games_for_selection == 69
            ' "$output/plan.json" \
              > "$output/plan-validation.stdout.log" 2> "$output/plan-validation.stderr.log"
            validation_code=$?
            set -e
            printf '%s\n' "$validation_code" > "$output/plan-validation-exit-code.txt"
            if (( validation_code != 0 )); then
              return "$validation_code"
            fi
            set +e
            "$runner" run --config "$config" \
              > "$output/runner.stdout.log" 2> "$output/runner.stderr.log"
            run_code=$?
            set -e
            printf '%s\n' "$run_code" > "$output/runner-exit-code.txt"
            return "$run_code"
          }
          export -f run_campaign

          set +e
          timeout --signal=INT --kill-after=20s 600s \
            bash --noprofile --norc -c 'run_campaign "$@"' -- "$runner" "$config" "$output" \
            > "$output/timeout.stdout.log" 2> "$output/timeout.stderr.log"
          exit_code=$?
          set -e

          printf '%s\n' "$exit_code" > "$output/exit-code.txt"
          plan_code=null
          run_code=null
          if [[ -f "$output/plan-exit-code.txt" ]]; then
            read -r plan_code < "$output/plan-exit-code.txt"
          fi
          if [[ -f "$output/runner-exit-code.txt" ]]; then
            read -r run_code < "$output/runner-exit-code.txt"
          fi
          jq -n \
            --arg started_at "$started_at" \
            --arg finished_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg workflow_commit "$GITHUB_SHA" \
            --arg workflow_run_id "$GITHUB_RUN_ID" \
            --arg workflow_run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg binary_sha256 "$binary_sha256" \
            --argjson exit_code "$exit_code" \
            --argjson plan_exit_code "$plan_code" \
            --argjson runner_exit_code "$run_code" \
            '{status:"finished", started_at:$started_at, finished_at:$finished_at,
              workflow_commit:$workflow_commit, workflow_run_id:$workflow_run_id,
              workflow_run_attempt:$workflow_run_attempt,
              binary_source_run_id:43686603978,
              binary_source_commit:"f550c0228774ff307135ec25c2e2138e6a97a236",
              binary_sha256:$binary_sha256, timeout_seconds:600,
              exit_code:$exit_code, plan_exit_code:$plan_exit_code,
              runner_exit_code:$runner_exit_code}' > "$output/execution.json"

      - name: Encrypt all available evidence
        id: encrypt
        if: always()
        run: |
          set -euo pipefail
          umask 077
          output="$GITHUB_WORKSPACE/live-smoke-output"
          if [[ ! -d "$output" ]]; then
            exit 0
          fi
          artifacts="$RUNNER_TEMP/artifacts"
          recipient="$GITHUB_WORKSPACE/capture-runner/operations/live-smoke-recipient.pem"
          mkdir -p "$artifacts"
          {
            tar -C "$GITHUB_WORKSPACE" -czf - live-smoke-output |
              openssl cms -encrypt -binary -aes-256-cbc -outform DER \
                -out "$artifacts/live-smoke-captures.p7m.tmp" "$recipient"
          } 2> "$RUNNER_TEMP/live-smoke-encryption.stderr.log"
          mv "$artifacts/live-smoke-captures.p7m.tmp" "$artifacts/live-smoke-captures.p7m"
          cd "$artifacts"
          sha256sum live-smoke-captures.p7m > live-smoke-captures.p7m.sha256
          printf 'encrypted=true\n' >> "$GITHUB_OUTPUT"

      - name: Upload encrypted evidence
        id: upload
        if: always() && steps.encrypt.outputs.encrypted == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: live-smoke-35x2-encrypted
          path: |
            ${{ runner.temp }}/artifacts/live-smoke-captures.p7m
            ${{ runner.temp }}/artifacts/live-smoke-captures.p7m.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Report counts and preserve the campaign result
        if: always()
        env:
          CAPTURE_OUTCOME: ${{ steps.capture.outcome }}
          ENCRYPT_OUTCOME: ${{ steps.encrypt.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
        run: |
          set -euo pipefail
          umask 077
          output="$GITHUB_WORKSPACE/live-smoke-output"
          exit_code=1
          if [[ -f "$output/exit-code.txt" ]]; then
            read -r saved_code < "$output/exit-code.txt"
            if [[ "$saved_code" =~ ^[0-9]{1,3}$ ]] && (( 10#$saved_code <= 255 )); then
              exit_code=$((10#$saved_code))
            fi
          fi
          campaign_code=$exit_code
          if [[ "$CAPTURE_OUTCOME" != success || "$ENCRYPT_OUTCOME" != success || "$UPLOAD_OUTCOME" != success ]]; then
            if (( exit_code == 0 )); then
              exit_code=1
            fi
          fi
          {
            printf '## Live smoke: 35 providers x 2 games\n\n'
            printf -- '- Campaign exit code: %s\n' "$campaign_code"
            printf -- '- Final exit code: %s\n' "$exit_code"
            if [[ -f "$output/plan.json" ]]; then
              jq -r '
                "- Providers selected: \(.providers | length)",
                "- Games selected: \([.providers[].games | numbers] | add // 0)",
                "- Games with executable modes: \([.providers[].games_with_executable_modes | numbers] | add // 0)",
                "- Executable modes: \([.providers[].executable_modes | numbers] | add // 0)"
              ' "$output/plan.json" 2> /dev/null || true
            fi
            if [[ "$UPLOAD_OUTCOME" == success ]]; then
              printf -- '- Encrypted evidence uploaded; retention: 7 days.\n'
            else
              printf -- '- Encrypted evidence was not uploaded successfully.\n'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$exit_code"
