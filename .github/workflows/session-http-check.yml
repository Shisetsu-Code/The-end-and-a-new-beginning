name: Check native HTTP after session inspection

on:
  workflow_run:
    workflows: ['Capture runner']
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: session-http-check
  cancel-in-progress: false

jobs:
  native-http:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Check whether this verified commit requested a campaign
        id: gate
        env:
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$VERIFIED_SHA"
          request_path=capture-runner/operations/session-http-request.json
          changed_request=$(git diff --name-only HEAD^ HEAD -- "$request_path")
          if [[ "$changed_request" == "$request_path" ]]; then
            printf 'requested=true\n' >> "$GITHUB_OUTPUT"
          elif [[ -n "$changed_request" ]]; then
            printf 'Unexpected request diff: %s\n' "$changed_request" >&2
            exit 1
          fi

      - name: Download the executable from that successful CI run
        if: steps.gate.outputs.requested == 'true'
        uses: actions/download-artifact@v4
        with:
          name: capture-runner-linux-x86_64
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
          path: ${{ runner.temp }}/session-http-bin

      - name: Run the same twelve games with native HTTP
        if: steps.gate.outputs.requested == 'true'
        id: capture
        env:
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
          VERIFIED_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          umask 077
          output="$GITHUB_WORKSPACE/session-http-output"
          runner="$RUNNER_TEMP/session-http-bin/capture-runner"
          config="$GITHUB_WORKSPACE/capture-runner/operations/session-http-request.json"
          mkdir -p "$output"
          printf '1\n' > "$output/exit-code.txt"
          cp "$config" "$output/config.json"
          chmod 700 "$runner"
          sha256sum "$runner" > "$output/binary.sha256"
          "$runner" plan --config "$config" --details > "$output/plan.json" 2> "$output/plan.stderr.log"
          jq -e '(.providers | length) == 6 and all(.providers[]; .games == 2 and .executable_modes == 2)
            and .maximum_active_games_for_selection == 12' "$output/plan.json" > /dev/null
          started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          set +e
          timeout --signal=INT --kill-after=20s 240s "$runner" run --config "$config" \
            > "$output/runner.stdout.log" 2> "$output/runner.stderr.log"
          code=$?
          set -e
          printf '%s\n' "$code" > "$output/exit-code.txt"
          jq -n --arg commit "$VERIFIED_SHA" --arg ci_run_id "$VERIFIED_RUN_ID" \
            --arg run_id "$GITHUB_RUN_ID" --arg started_at "$started_at" \
            --arg finished_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --argjson exit_code "$code" \
            '{commit:$commit,ci_run_id:$ci_run_id,workflow_run_id:$run_id,
            started_at:$started_at,finished_at:$finished_at,exit_code:$exit_code}' > "$output/execution.json"

      - name: Encrypt all available captures
        id: encrypt
        if: always() && steps.gate.outputs.requested == 'true'
        run: |
          set -euo pipefail
          umask 077
          output="$GITHUB_WORKSPACE/session-http-output"
          if [[ ! -d "$output" ]]; then exit 0; fi
          artifacts="$RUNNER_TEMP/session-http-artifacts"
          mkdir -p "$artifacts"
          tar -C "$GITHUB_WORKSPACE" -czf - session-http-output |
            openssl cms -encrypt -binary -aes-256-cbc -outform DER \
              -out "$artifacts/session-http.p7m" \
              "$GITHUB_WORKSPACE/capture-runner/operations/live-smoke-recipient.pem"
          cd "$artifacts"
          sha256sum session-http.p7m > session-http.p7m.sha256
          printf 'encrypted=true\n' >> "$GITHUB_OUTPUT"

      - name: Upload encrypted captures
        id: upload
        if: always() && steps.encrypt.outputs.encrypted == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: session-http-12-encrypted
          path: |
            ${{ runner.temp }}/session-http-artifacts/session-http.p7m
            ${{ runner.temp }}/session-http-artifacts/session-http.p7m.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Preserve the native result
        if: always() && steps.gate.outputs.requested == 'true'
        env:
          CAPTURE_OUTCOME: ${{ steps.capture.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
        run: |
          set -euo pipefail
          code=1
          output="$GITHUB_WORKSPACE/session-http-output"
          if [[ -f "$output/exit-code.txt" ]]; then
            read -r value < "$output/exit-code.txt"
            if [[ "$value" =~ ^[0-9]{1,3}$ ]] && (( 10#$value <= 255 )); then code=$((10#$value)); fi
          fi
          if [[ "$CAPTURE_OUTCOME" != success || "$UPLOAD_OUTCOME" != success ]]; then code=1; fi
          printf '## Native HTTP sample\n\n12 normal modes; campaign exit code: %s. Evidence upload: %s.\n' \
            "$code" "$UPLOAD_OUTCOME" >> "$GITHUB_STEP_SUMMARY"
          exit "$code"
